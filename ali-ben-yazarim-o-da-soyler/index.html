<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Ali & Ben Yazarım O da Söyler</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: #f4f4f9; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        textarea { width: 100%; height: 100px; margin-bottom: 10px; }
        button { padding: 10px 20px; cursor: pointer; background: #28a745; color: white; border: none; border-radius: 5px; }
        .metin-kutu { border: 1px solid #ddd; padding: 10px; margin-top: 10px; border-radius: 5px; background: #fafafa; }
    </style>
</head>
<body>

<div class="container">
    <h2>Sesli Metin Okuyucu</h2>
    <textarea id="metinGiris" placeholder="Buraya metnini yaz..."></textarea>
    <br>
    <label>Tekrar Sayısı:</label>
    <input type="number" id="tekrarSayisi" value="1" min="1">
    <button onclick="ekleVeOku()">Sıraya Ekle ve Oku</button>

    <div id="listeAlani"></div>
</div>

<script>
    function ekleVeOku() {
        let metin = document.getElementById("metinGiris").value;
        let tekrar = document.getElementById("tekrarSayisi").value;
        
        if (metin.trim() === "") return;

        // Ekrana listeleme
        let div = document.createElement("div");
        div.className = "metin-kutu";
        div.innerText = "Okunuyor: " + metin + " (" + tekrar + " kez)";
        document.getElementById("listeAlani").appendChild(div);

        // Sıralı okuma mantığı
        for (let i = 0; i < tekrar; i++) {
            let konusma = new SpeechSynthesisUtterance(metin);
            konusma.lang = 'tr-TR';
            // Ses tonu kalitesini tarayıcı destekliyorsa artırır
            window.speechSynthesis.speak(konusma);
        }
        
        // Kutuyu temizle ki yenisini hemen yazabilesin
        document.getElementById("metinGiris").value = "";
    }
</script>

</body>
</html>
