<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Eymen DEMİRCİ KRAL(Güncel)</title>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; user-select: none; }
        canvas { display: block; filter: contrast(1.1) saturate(1.2); }
        
        #hud { position: absolute; top: 20px; left: 20px; pointer-events: none; z-index: 100; }
        .bar-container { width: 250px; background: rgba(0,0,0,0.5); border: 2px solid #555; border-radius: 8px; margin-bottom: 5px; padding: 2px; position: relative; }
        .bar-fill { height: 15px; border-radius: 5px; transition: width 0.3s; }
        #hp-fill { background: linear-gradient(90deg, #ff4b2b, #ff416c); width: 100%; box-shadow: 0 0 10px #f00; }
        #xp-fill { background: linear-gradient(90deg, #1d976c, #93f9b9); width: 0%; box-shadow: 0 0 10px #0f0; }
        #ult-container { display: none; }
        #ult-fill { background: linear-gradient(90deg, #00c6ff, #0072ff); width: 0%; box-shadow: 0 0 10px #00c6ff; }
        .bar-label { position: absolute; inset: 0; text-align: center; font-size: 11px; font-weight: bold; color: #fff; line-height: 15px; }
        
        .stats { font-size: 20px; color: #ffcc00; font-weight: bold; text-shadow: 2px 2px #000; background: rgba(0,0,0,0.4); padding: 5px 15px; border-radius: 20px; display: inline-block; }

        #inv-screen { 
            position: absolute; inset: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(5px);
            display: none; align-items: center; justify-content: center; z-index: 1000;
        }
        .inv-box { background: #1a1a1a; border: 4px solid #444; padding: 25px; border-radius: 20px; display: flex; gap: 20px; width: 1100px; height: 550px; box-sizing: border-box; }
        
        .inv-left { width: 500px; display: flex; flex-direction: column; flex-shrink: 0; }
        .grid { display: grid; grid-template-columns: repeat(6, 75px); gap: 8px; overflow-y: auto; flex: 1; padding-right: 5px; }
        .slot { width: 75px; height: 75px; background: #252525; border: 2px solid #444; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 24px; position: relative; border-radius: 10px; cursor: pointer; transition: 0.2s; }
        .slot:hover { border-color: #ffcc00; background: #333; }
        .slot.equipped { border-color: #00ff00; background: #153315; }
        .slot::after { content: attr(data-count); position: absolute; bottom: 2px; right: 5px; font-size: 12px; color: #ffcc00; font-weight: bold; }
        .slot-name { font-size: 9px; color: #aaa; text-align: center; position: absolute; bottom: 2px; left: 2px; max-width: 50px; overflow: hidden; white-space: nowrap; }

        .inv-right { width: 260px; border-left: 2px solid #333; padding-left: 15px; display: flex; flex-direction: column; flex-shrink: 0; }
        #inspect-panel { flex: 1; background: #222; border-radius: 10px; padding: 15px; border: 1px solid #444; font-size: 13px; line-height: 1.6; overflow-y: auto; }
        
        #npc-ui { display: none; width: 280px; border-left: 2px solid #333; padding-left: 15px; overflow-y: auto; flex-shrink: 0; }
        .npc-btn { cursor: pointer; padding: 10px; background: #252525; color: #fff; border: 1px solid #ffcc00; margin-bottom: 8px; border-radius: 8px; width: 100%; transition: 0.2s; text-align: left; font-size: 12px; }
        .npc-btn:hover { background: #ffcc00; color: #000; font-weight: bold; }

        #hotbar { position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%); display: flex; gap: 12px; background: rgba(20,20,20,0.9); padding: 12px; border-radius: 15px; border: 2px solid #444; }
        .h-slot { width: 55px; height: 55px; background: #1a1a1a; border: 2px solid #333; display: flex; align-items: center; justify-content: center; font-size: 24px; border-radius: 10px; position: relative; }
        .h-slot::after { content: attr(data-name); position: absolute; bottom: 1px; font-size: 9px; color: #888; }
        .h-slot.active { border-color: #ffcc00; background: #332b00; box-shadow: 0 0 20px rgba(255,204,0,0.4); }
        #h-4 { display: none; }

        #alert { position: absolute; bottom: 130px; width: 100%; text-align: center; color: #fff; font-size: 18px; font-weight: bold; display: none; text-shadow: 2px 2px #000; letter-spacing: 2px; }
    </style>
</head>
<body>

<div id="hud">
    <div class="bar-container"><div id="hp-fill" class="bar-fill"></div><div class="bar-label">CAN</div></div>
    <div class="bar-container"><div id="xp-fill" class="bar-fill"></div><div class="bar-label">XP</div></div>
    <div class="bar-container" id="ult-container"><div id="ult-fill" class="bar-fill"></div><div class="bar-label" id="ult-label">YETENEK (%0) - [Q]</div></div>
    <div class="stats">💰 <span id="gold-txt">500</span> | LVL: <span id="lvl-txt">1</span> | <span id="world-txt">KASABA</span></div>
</div>

<div id="alert">● [E] ETKİLEŞİME GEÇ</div>

<div id="inv-screen">
    <div class="inv-box">
        <div class="inv-left">
            <h2 style="color:#ffcc00; margin: 0 0 15px 0; display:flex; justify-content:space-between; align-items:center;">
                <span>ENVANTER</span>
                <span style="font-size:11px; color:#888;">Tıkla ve Kuşan</span>
            </h2>
            <div class="grid" id="main-inv"></div>
            <button onclick="toggleInv()" style="background:#600; color:white; border:none; padding:12px; width:100%; margin-top:15px; border-radius:8px; cursor:pointer; font-weight:bold;">KAPAT</button>
        </div>
        
        <div class="inv-right">
            <h2 style="color:#00ffff; margin:0 0 15px 0;">İNCELEME</h2>
            <div id="inspect-panel">Bir eşya seçin...</div>
        </div>

        <div id="npc-ui">
            <h2 id="npc-name" style="color: #ff9900; margin:0 0 15px 0;">DÜKKAN</h2>
            <div id="npc-actions"></div>
        </div>
    </div>
</div>

<div id="hotbar">
    <div class="h-slot active" id="h-1" data-name="SİLAH">🗡️</div>
    <div class="h-slot" id="h-2" data-name="KAZMA">⛏️</div>
    <div class="h-slot" id="h-3" data-name="CAN">💊</div>
    <div class="h-slot" id="h-4" data-name="YAY">🏹</div>
</div>

<canvas id="c"></canvas>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const MATS = [
    { n: 'BAKIR', c: '#b87333', p: 1, v: 25, key: 'bakir' },
    { n: 'TAŞ', c: '#777', p: 2, v: 60, key: 'stone' },
    { n: 'DEMİR', c: '#ddd', p: 5, v: 180, key: 'iron' },
    { n: 'ALTIN', c: '#ffd700', p: 10, v: 500, key: 'gold' },
    { n: 'KRİSTAL', c: '#ff00ff', p: 20, v: 1500, key: 'kristal' },
    { n: 'ELMAS', c: '#00ffff', p: 40, v: 4000, key: 'diam' },
    { n: 'OBSİDYEN', c: '#2e0854', p: 100, v: 10000, key: 'obsidyen' }
];

const Game = {
    world: 'KASABA', gold: 500, hp: 100, xp: 0, playerLvl: 1, slot: 1, invOpen: false, shake: 0, ult: 0,
    items: [
        { id: 'w_0', type: 'weapon', name: 'bakir_sword', display: 'Bakır Kılıç', matIdx: 0, power: 10, count: 1, eq: true },
        { id: 'p_0', type: 'pick', name: 'bakir_pick', display: 'Bakır Kazma', matIdx: 0, power: 1, count: 1, eq: true },
        { id: 'med', type: 'usable', name: 'meds', display: 'Can Paketi', count: 20 }
    ],
    equipped: { weapon: 'w_0', pick: 'p_0', head: null, chest: null },
    enchant: { type: 'Normal', p: 1 },
    p: { x: 400, y: 300, s: 6, anim: 0 },
    cam: { x: 0, y: 0 },
    blocks: [], mobs: [], parts: [], projectiles: [], enemyProjectiles: [], keys: {}, selectedItem: null,
    chests: [], bossAltars: [], bowUnlocked: false, bowCd: 0
};

function getLayer(y) {
    if (y < 3500) return 0;
    if (y < 7000) return 1;
    if (y < 11000) return 2;
    if (y < 15000) return 3;
    if (y < 19000) return 4;
    if (y < 22000) return 5;
    return 6;
}

function triggerSpawnAt(x, y) {
    if (y <= 600) return;
    let layer = getLayer(y);
    
    if (layer === 0) { 
        Game.mobs.push({x, y, hp: 80, maxHp: 80, s: 2, size: 40, c: "#2d5a27", type: 'normal', cd: 0, frozen: 0});
    } else if (layer === 1) { 
        Game.mobs.push({x, y, hp: 50, maxHp: 50, s: 3.4, size: 36, c: "#ff6600", type: 'exploder', cd: 0, frozen: 0});
    } else if (layer === 2) { 
        Game.mobs.push({x, y, hp: 60, maxHp: 60, s: 1.5, size: 38, c: "#aaaaaa", type: 'archer', cd: 60, frozen: 0});
    } else if (layer === 3) { 
        Game.mobs.push({x, y, hp: 130, maxHp: 130, s: 2.2, size: 42, c: "#ffd700", type: 'gold_knight', cd: 40, dashTimer: 0, dashX: 0, dashY: 0, frozen: 0});
    } else if (layer === 4) { 
        Game.mobs.push({x, y, hp: 400, maxHp: 400, s: 1.8, size: 55, c: "#9932cc", type: 'witch_boss', cd: 120, frozen: 0});
    } else if (layer === 5) { 
        Game.mobs.push({x, y, hp: 140, maxHp: 140, s: 3.8, size: 45, c: "#00ffff", type: 'guardian', cd: 0, frozen: 0});
    } else { 
        Game.mobs.push({x, y, hp: 220, maxHp: 220, s: 3.5, size: 80, c: "#660066", type: 'boss', cd: 0, frozen: 0});
    }
}

function spawnBoss(type, x, y) {
    if (type === 0) {
        Game.mobs.push({x, y, hp: 600, maxHp: 600, s: 2.5, size: 90, c: "#4a9a3b", type: 'boss_normal', cd: 0, frozen: 0, isBoss: true});
    } else if (type === 1) {
        Game.mobs.push({x, y, hp: 500, maxHp: 500, s: 4.0, size: 80, c: "#ff3300", type: 'boss_exploder', cd: 0, frozen: 0, isBoss: true});
    } else if (type === 2) {
        Game.mobs.push({x, y, hp: 700, maxHp: 700, s: 2.0, size: 85, c: "#dddddd", type: 'boss_archer', cd: 45, frozen: 0, isBoss: true});
    } else if (type === 3) {
        Game.mobs.push({x, y, hp: 1000, maxHp: 1000, s: 3.0, size: 95, c: "#ffaa00", type: 'boss_gold_knight', cd: 30, dashTimer: 0, dashX: 0, dashY: 0, frozen: 0, isBoss: true});
    } else if (type === 4) {
        Game.mobs.push({x, y, hp: 1500, maxHp: 1500, s: 2.2, size: 110, c: "#6a0dad", type: 'boss_witch', cd: 60, frozen: 0, isBoss: true});
    } else if (type === 5) {
        Game.mobs.push({x, y, hp: 1800, maxHp: 1800, s: 4.2, size: 100, c: "#00bfff", type: 'boss_guardian', cd: 70, frozen: 0, isBoss: true});
    } else if (type === 6) {
        Game.mobs.push({x, y, hp: 4000, maxHp: 4000, s: 5.0, size: 150, c: "#3a003a", type: 'ultra_boss', cd: 90, frozen: 0, isBoss: true});
    }
}

function spawnMine() {
    Game.blocks = []; Game.mobs = []; Game.projectiles = []; Game.enemyProjectiles = [];
    Game.chests = []; Game.bossAltars = [];

    // Blok Üretimi
    for(let i=0; i<600; i++) {
        let y = Math.random() * 25000 + 800;
        let x = (Math.random() - 0.5) * 4000;
        let type = getLayer(y);
        Game.blocks.push({ x, y, type, hp: (type + 1) * 10, max: (type + 1) * 10, ess: Math.random() < 0.006 ? (Math.random() < 0.5 ? 'fire' : 'ice') : null });
    }

    // Her Katmanda 2 Sandık ve 1 Boss Sunağı Üretme Mantığı
    const layerRanges = [
        { min: 800, max: 3500 }, { min: 3500, max: 7000 }, { min: 7000, max: 11000 },
        { min: 11000, max: 15000 }, { min: 15000, max: 19000 }, { min: 19000, max: 22000 },
        { min: 22000, max: 25800 }
    ];

    layerRanges.forEach((range, idx) => {
        // 2 Sandık Yerleştir
        for(let s=0; s<2; s++) {
            Game.chests.push({
                x: (Math.random() - 0.5) * 3000,
                y: Math.random() * (range.max - range.min) + range.min,
                layer: idx,
                opened: false
            });
        }
        // 1 Altar Yerleştir
        Game.bossAltars.push({
            x: (Math.random() - 0.5) * 1500,
            y: Math.random() * (range.max - range.min) + range.min,
            layer: idx,
            insertedKeys: 0,
            summoned: false
        });
    });

    for (let i = 0; i < 1; i++) {
        let spawnY = Game.p.y + (Math.random() - 0.5) * 400 + 150;
        let spawnX = Game.p.x + (Math.random() - 0.5) * 800;
        if(Math.random() < 0.5) triggerSpawnAt(spawnX, spawnY);
    }
}

function toggleInv() {
    Game.invOpen = !Game.invOpen;
    const screen = document.getElementById("inv-screen");
    if(Game.invOpen) {
        screen.style.display = "flex";
        checkNPC();
        updateUI();
    } else {
        screen.style.display = "none";
        document.getElementById("npc-ui").style.display = "none";
    }
}

window.onkeydown = (e) => { 
    Game.keys[e.code] = true; 
    if(e.code === "KeyE") toggleInv();
    if(e.code === "KeyQ") useUltimate();
    if(e.key === "1") setSlot(1);
    if(e.key === "2") setSlot(2);
    if(e.key === "3") setSlot(3);
    if(e.key === "4" && Game.bowUnlocked) setSlot(4);
};
window.onkeyup = (e) => Game.keys[e.code] = false;

function setSlot(n) {
    Game.slot = n;
    document.querySelectorAll('.h-slot').forEach(s => s.classList.remove('active'));
    document.getElementById('h-' + n).classList.add('active');
}

function getInvItem(name) { return Game.items.find(i => i.name === name); }
function addInvItem(itemObj) {
    let existing = Game.items.find(i => i.name === itemObj.name && i.type === itemObj.type && !i.id);
    if(existing && (itemObj.type === 'resource' || itemObj.type === 'mold' || itemObj.type === 'usable' || itemObj.type === 'key')) { existing.count += itemObj.count; } 
    else { Game.items.push({ ...itemObj, id: itemObj.id || 'gen_' + Math.random() }); }
}

function createParticles(x, y, color, count) {
    for(let i=0; i<count; i++) {
        Game.parts.push({ x, y, vx: (Math.random()-0.5)*12, vy: (Math.random()-0.5)*12, l: 25+Math.random()*20, c: color });
    }
}

function useUltimate() {
    if(Game.enchant.type === 'Normal' || Game.ult < 100) return;
    Game.ult = 0;
    Game.shake = 30;
    if(Game.enchant.type === 'Ateş') {
        createParticles(Game.p.x, Game.p.y, "#ff3300", 100);
        Game.mobs.forEach(m => {
            let d = Math.hypot(Game.p.x - m.x, Game.p.y - m.y);
            if(d < 800) { m.hp -= 250; createParticles(m.x, m.y, "#ffcc00", 15); }
        });
    } else if(Game.enchant.type === 'Buz') {
        createParticles(Game.p.x, Game.p.y, "#00ffff", 100);
        Game.mobs.forEach(m => {
            let d = Math.hypot(Game.p.x - m.x, Game.p.y - m.y);
            if(d < 800) { m.frozen = 180; m.hp -= 50; createParticles(m.x, m.y, "#00ffff", 10); }
        });
    }
    Game.enchant = { type: 'Normal', p: 1 };
    document.getElementById("ult-container").style.display = "none";
    updateUI();
}

function update() {
    if(Game.invOpen) return;

    let dx = 0, dy = 0;
    if(Game.keys["ArrowUp"]) dy -= Game.p.s;
    if(Game.keys["ArrowDown"]) dy += Game.p.s;
    if(Game.keys["ArrowLeft"]) dx -= Game.p.s;
    if(Game.keys["ArrowRight"]) dx += Game.p.s;
    
    Game.p.x += dx; Game.p.y += dy;
    if(dx !== 0 || dy !== 0) Game.p.anim += 0.15;

    Game.cam.x += (Game.p.x - canvas.width/2 - Game.cam.x) * 0.08;
    Game.cam.y += (Game.p.y - canvas.height/2 - Game.cam.y) * 0.08;

    if(Game.bowCd > 0) Game.bowCd--;

    let nearInteraction = false;
    // Kasaba NPC Kontrolü
    let nearNPC = dist(Game.p, {x:-400, y:200}) < 150 || 
                   dist(Game.p, {x:400, y:200}) < 150 || 
                   dist(Game.p, {x:0, y:-250}) < 150 || 
                   dist(Game.p, {x:500, y:-400}) < 150;
                   
    if(Game.world === 'KASABA' && nearNPC) nearInteraction = true;

    // Maden Sandık ve Altar Kontrolü
    if(Game.world === 'MADEN') {
        Game.chests.forEach(c => {
            if(!c.opened && Math.hypot(Game.p.x - c.x, Game.p.y - c.y) < 100) {
                nearInteraction = true;
                if(Game.keys["KeyE"]) {
                    c.opened = true;
                    let matKey = MATS[c.layer].key;
                    let matDisplay = MATS[c.layer].n;
                    
                    // 5 Adet Katman Madeni Ver
                    let resItem = getInvItem(matKey);
                    if(!resItem) addInvItem({ type: 'resource', name: matKey, display: matDisplay, count: 5 });
                    else resItem.count += 5;
                    
                    // 1 Adet Katman Boss Anahtarı Ver
                    let keyName = 'boss_key_' + c.layer;
                    let keyItem = getInvItem(keyName);
                    if(!keyItem) addInvItem({ type: 'key', name: keyName, display: matDisplay + ' Boss Anahtarı', count: 1 });
                    else keyItem.count += 1;
                    
                    createParticles(c.x, c.y, "#ffff00", 20);
                    updateUI();
                }
            }
        });

        Game.bossAltars.forEach(a => {
            if(!a.summoned && Math.hypot(Game.p.x - a.x, Game.p.y - a.y) < 120) {
                nearInteraction = true;
                if(Game.keys["KeyE"]) {
                    let keyName = 'boss_key_' + a.layer;
                    let keyItem = getInvItem(keyName);
                    if(keyItem && keyItem.count > 0 && a.insertedKeys < 2) {
                        keyItem.count--;
                        a.insertedKeys++;
                        createParticles(a.x, a.y, "#00ffff", 15);
                        Game.keys["KeyE"] = false;
                        if(a.insertedKeys === 2) {
                            a.summoned = true;
                            spawnBoss(a.layer, a.x, a.y - 150);
                        }
                        updateUI();
                    }
                }
            }
        });
    }

    if(nearInteraction) {
        document.getElementById("alert").style.display = "block";
    } else {
        document.getElementById("alert").style.display = "none";
    }

    if(Game.world === 'KASABA' && Game.p.y > 1000) { Game.world = 'MADEN'; Game.p.y = 100; spawnMine(); document.getElementById("world-txt").innerText = "MADEN"; }
    if(Game.world === 'MADEN' && Game.p.y < -50) { Game.world = 'KASABA'; Game.p.y = 900; document.getElementById("world-txt").innerText = "KASABA"; }

    // Saldırı Döngüleri
    if(Game.keys["Space"]) {
        let activeWeapon = Game.items.find(i => i.id === Game.equipped.weapon);
        let activePick = Game.items.find(i => i.id === Game.equipped.pick);

        // KAZMA
        if(Game.slot === 2 && activePick) {
            Game.blocks.forEach((b, i) => {
                if(Math.hypot(Game.p.x - b.x, Game.p.y - b.y) < 110) {
                    b.hp -= 0.4 * activePick.power; Game.shake = 3;
                    createParticles(b.x, b.y, MATS[b.type].c, 2);
                    if(b.hp <= 0) {
                        let key = MATS[b.type].key;
                        let resItem = getInvItem(key);
                        if(!resItem) { addInvItem({ type: 'resource', name: key, display: MATS[b.type].n, count: 1 }); } else { resItem.count++; }
                        
                        if(b.ess) {
                            let essKey = b.ess === 'fire' ? 'fire_ess' : 'ice_ess';
                            let essItem = getInvItem(essKey);
                            if(!essItem) addInvItem({ type: 'resource', name: essKey, display: b.ess === 'fire' ? 'Ateş Esansı' : 'Buz Esansı', count: 1 });
                            else essItem.count++;
                        }
                        Game.xp += 8; Game.blocks.splice(i,1); updateUI();
                    }
                }
            });
        }
        // KILIÇ
        if(Game.slot === 1 && activeWeapon) {
            Game.mobs.forEach((m, i) => {
                if(Math.hypot(Game.p.x - m.x, Game.p.y - m.y) < 130) {
                    m.hp -= activeWeapon.power * Game.enchant.p; Game.shake = 6;
                    createParticles(m.x, m.y, "#f00", 5);
                    if(Game.enchant.type !== 'Normal' && Game.ult < 100) { Game.ult = Math.min(100, Game.ult + 5); updateUI(); }
                    if(m.hp <= 0) { 
                        handleMobDeath(m, i);
                    }
                }
            });
        }
        // CAN PAKETİ
        if(Game.slot === 3) {
            let medItem = getInvItem('meds');
            if(medItem && medItem.count > 0 && Game.hp < 100) {
                Game.hp = Math.min(100, Game.hp + 45); medItem.count--; 
                createParticles(Game.p.x, Game.p.y, "#0f0", 15); updateUI();
                Game.keys["Space"] = false;
            }
        }
        // YAY SALDIRISI (SLOT 4)
        if(Game.slot === 4 && Game.bowUnlocked && Game.bowCd === 0) {
            Game.bowCd = 25; // Ok atma bekleme süresi
            // En yakın canavara doğru fırlat, yoksa baktığı yöne gitsin
            let targetAngle = 0;
            if(Game.mobs.length > 0) {
                let closest = Game.mobs[0];
                let minDist = Math.hypot(closest.x - Game.p.x, closest.y - Game.p.y);
                Game.mobs.forEach(m => {
                    let curD = Math.hypot(m.x - Game.p.x, m.y - Game.p.y);
                    if(curD < minDist) { minDist = curD; closest = m; }
                });
                targetAngle = Math.atan2(closest.y - Game.p.y, closest.x - Game.p.x);
            } else {
                targetAngle = Game.p.anim;
            }
            Game.projectiles.push({
                x: Game.p.x,
                y: Game.p.y,
                vx: Math.cos(targetAngle) * 11,
                vy: Math.sin(targetAngle) * 11,
                l: 90,
                power: 65 * Game.enchant.p
            });
            createParticles(Game.p.x, Game.p.y, "#ffffff", 4);
        }
    }

    // Oyuncu Oklarının İlerlemesi ve Hasarı
    Game.projectiles.forEach((p, pi) => {
        p.x += p.vx; p.y += p.vy; p.l--;
        Game.mobs.forEach((m, mi) => {
            if(Math.hypot(m.x - p.x, m.y - p.y) < (m.size/2 + 10)) {
                m.hp -= p.power;
                createParticles(m.x, m.y, "#ff0000", 6);
                Game.projectiles.splice(pi, 1);
                if(m.hp <= 0) handleMobDeath(m, mi);
            }
        });
        if(p.l <= 0) Game.projectiles.splice(pi, 1);
    });

    if(Game.world === 'MADEN') {
        for(let i = Game.mobs.length - 1; i >= 0; i--) {
            if(!Game.mobs[i].isBoss && Math.abs(Game.mobs[i].y - Game.p.y) > 1200) {
                Game.mobs.splice(i, 1);
            }
        }

        if(Game.mobs.length < 4) {
            if(Math.random() < 0.003 || (dx !== 0 || dy !== 0 && Math.random() < 0.001)) {
                let spawnY = Game.p.y + (Math.random() - 0.5) * 600 + (dy * 40);
                let spawnX = Game.p.x + (Math.random() - 0.5) * 1100 + (dx * 40);
                triggerSpawnAt(spawnX, spawnY);
            }
        }
    }

    // Düşman Ok ve Projeleri Döngüsü
    Game.enemyProjectiles.forEach((p, pi) => {
        p.x += p.vx; p.y += p.vy; p.l--;
        if(Math.hypot(Game.p.x - p.x, Game.p.y - p.y) < 25) {
            let headArm = Game.items.find(i => i.id === Game.equipped.head);
            let chestArm = Game.items.find(i => i.id === Game.equipped.chest);
            let def = (headArm ? headArm.power : 0) + (chestArm ? chestArm.power : 0);
            Game.hp -= Math.max(2, p.dmg - def/10);
            Game.enemyProjectiles.splice(pi, 1);
            updateUI();
        } else if(p.l <= 0) Game.enemyProjectiles.splice(pi, 1);
    });

    // Yapay Zeka ve Canavar Davranışları
    Game.mobs.forEach((m, i) => {
        if(m.frozen > 0) { m.frozen--; return; }
        let d = Math.hypot(Game.p.x - m.x, Game.p.y - m.y);
        
        // --- NORMAL MOB VE BOSS DAVRANIŞLARI YAPISI ---
        if(m.type === 'gold_knight' || m.type === 'boss_gold_knight') {
            let dashRange = m.type === 'boss_gold_knight' ? 1200 : 500;
            let dashSpeed = m.type === 'boss_gold_knight' ? 24 : 12;
            let baseDmg = m.type === 'boss_gold_knight' ? 20 : 10;

            if(m.dashTimer > 0) {
                m.x += m.dashX * dashSpeed; m.y += m.dashY * dashSpeed; m.dashTimer--;
                if(Math.random() < 0.3) createParticles(m.x, m.y, "#ffd700", 1);
                if(d < (m.size/2 + 20)) {
                    let headArm = Game.items.find(i => i.id === Game.equipped.head);
                    let chestArm = Game.items.find(i => i.id === Game.equipped.chest);
                    let def = (headArm ? headArm.power : 0) + (chestArm ? chestArm.power : 0);
                    Game.hp -= Math.max(4, baseDmg - def/50); updateUI();
                }
                return;
            } else {
                m.cd--;
                if(m.cd <= 0 && d < dashRange && Math.random() < 0.03) {
                    let angle = Math.atan2(Game.p.y - m.y, Game.p.x - m.x);
                    m.dashX = Math.cos(angle); m.dashY = Math.sin(angle);
                    m.dashTimer = m.type === 'boss_gold_knight' ? 35 : 20; 
                    m.cd = Math.random() * 80 + 60; return;
                }
            }
        }

        if(m.type === 'witch_boss' || m.type === 'boss_witch') {
            m.cd--;
            if(m.cd <= 0) {
                let limit = m.type === 'boss_witch' ? 12 : 6;
                let spawnDist = m.type === 'boss_witch' ? 70 : 50;
                if(Game.mobs.length < limit) {
                    Game.mobs.push({x: m.x + spawnDist, y: m.y + 30, hp: 50, maxHp:50, s: 2.2, size: 35, c: "#e0e0e0", type: 'normal', cd: 0, frozen: 0});
                    Game.mobs.push({x: m.x - spawnDist, y: m.y + 30, hp: 40, maxHp:40, s: 1.5, size: 35, c: "#aaaaaa", type: 'archer', cd: 50, frozen: 0});
                    createParticles(m.x, m.y, "#9932cc", 15);
                }
                m.cd = m.type === 'boss_witch' ? 140 : 240;
            }
        }

        if(m.type === 'boss_guardian') {
            m.cd--;
            if(m.cd <= 0 && d < 900) {
                let angle = Math.atan2(Game.p.y - m.y, Game.p.x - m.x);
                // İleri seviye büyük şok dalgası fırlatır
                Game.enemyProjectiles.push({x: m.x, y: m.y, vx: Math.cos(angle)*10, vy: Math.sin(angle)*10, l: 150, dmg: 35, isWave: true});
                m.cd = 100;
            }
        }

        if(m.type === 'ultra_boss') {
            m.cd--;
            if(m.cd <= 0 && d < 400) {
                // Alan Hasarı Vuruşu (Deprem)
                Game.shake = 25;
                createParticles(m.x, m.y, "#660066", 60);
                if(d < 350) {
                    let headArm = Game.items.find(i => i.id === Game.equipped.head);
                    let chestArm = Game.items.find(i => i.id === Game.equipped.chest);
                    let def = (headArm ? headArm.power : 0) + (chestArm ? chestArm.power : 0);
                    Game.hp -= Math.max(10, 50 - def/5);
                    updateUI();
                }
                m.cd = 110;
            }
        }

        // Genel Takip Mekaniği
        if(d < 900 || m.isBoss) {
            if((m.type === 'archer' || m.type === 'boss_archer') && d < 350) {
                m.x -= (Game.p.x - m.x)/d * m.s; m.y -= (Game.p.y - m.y)/d * m.s;
            } else {
                m.x += (Game.p.x - m.x)/d * m.s; m.y += (Game.p.y - m.y)/d * m.s;
            }

            // Normal ve Boss Okçu Atışları
            if(m.type === 'archer') {
                m.cd--;
                if(m.cd <= 0) {
                    let angle = Math.atan2(Game.p.y - m.y, Game.p.x - m.x);
                    Game.enemyProjectiles.push({x: m.x, y: m.y, vx: Math.cos(angle)*7, vy: Math.sin(angle)*7, l: 120, dmg: 18});
                    m.cd = 90;
                }
            }
            if(m.type === 'boss_archer') {
                m.cd--;
                if(m.cd <= 0) {
                    let angle = Math.atan2(Game.p.y - m.y, Game.p.x - m.x);
                    // Üçlü ok atar
                    Game.enemyProjectiles.push({x: m.x, y: m.y, vx: Math.cos(angle - 0.2)*8, vy: Math.sin(angle - 0.2)*8, l: 130, dmg: 25});
                    Game.enemyProjectiles.push({x: m.x, y: m.y, vx: Math.cos(angle)*8, vy: Math.sin(angle)*8, l: 130, dmg: 25});
                    Game.enemyProjectiles.push({x: m.x, y: m.y, vx: Math.cos(angle + 0.2)*8, vy: Math.sin(angle + 0.2)*8, l: 130, dmg: 25});
                    m.cd = 80;
                }
            }

            // Temas Hasarları
            if(d < (m.size/2 + 20)) {
                let headArm = Game.items.find(i => i.id === Game.equipped.head);
                let chestArm = Game.items.find(i => i.id === Game.equipped.chest);
                let def = (headArm ? headArm.power : 0) + (chestArm ? chestArm.power : 0);
                
                if(m.type === 'exploder') {
                    Game.hp -= Math.max(5, 45 - def/4);
                    createParticles(m.x, m.y, "#ff3300", 30);
                    Game.mobs.splice(i, 1);
                } else if(m.type === 'boss_exploder') {
                    // Oyuncu yanındayken patlar AMA ÖLMEZ!
                    m.cd--;
                    if(m.cd <= 0 || !m.hasOwnProperty('lastExplode') || Date.now() - m.lastExplode > 1200) {
                        Game.hp -= Math.max(8, 55 - def/3);
                        createParticles(m.x, m.y, "#ff3300", 40);
                        Game.shake = 15;
                        m.lastExplode = Date.now();
                    }
                } else if(m.type === 'boss_normal') {
                    Game.hp -= Math.max(2, 3.5 - def/80);
                } else if(m.type === 'ultra_boss') {
                    Game.hp -= Math.max(4, 6.0 - def/50);
                } else if(m.type === 'boss') {
                    Game.hp -= Math.max(0.4, 2.0 - def/100);
                } else if(m.type === 'guardian' || m.type === 'boss_guardian') {
                    let mult = m.type === 'boss_guardian' ? 4 : 1.3;
                    Game.hp -= Math.max(0.5, mult - def/100);
                } else if(m.type === 'witch_boss' || m.type === 'boss_witch') {
                    let mult = m.type === 'boss_witch' ? 3.5 : 1.8;
                    Game.hp -= Math.max(0.4, mult - def/100);
                } else {
                    Game.hp -= Math.max(0.1, 0.6 - def/200);
                }
                updateUI();
            }
        }
    });

    Game.parts.forEach((p, i) => { p.x += p.vx; p.y += p.vy; p.l--; if(p.l <= 0) Game.parts.splice(i,1); });
    if(Game.xp >= 100) { Game.xp = 0; Game.playerLvl++; updateUI(); }
    if(Game.hp <= 0) { alert("ÖLDÜNÜZ! OYUN YENİDEN BAŞLATILIYOR."); location.reload(); }
}

function handleMobDeath(m, index) {
    let goldAward = 120;
    let xpAward = 25;
    
    if(m.isBoss) {
        goldAward = 2000; xpAward = 300;
        if(m.type === 'boss_archer') {
            Game.bowUnlocked = true;
            document.getElementById("h-4").style.display = "flex";
            alert("🎯 İSKELET BOSS'U MAĞLUP EDİLDİ! YAY KİLİDİ AÇILDI! 4 TUŞUNA BASARAK SEÇEBİLİRSİN!");
        }
    } else {
        if(m.type === 'boss') { goldAward = 350; xpAward = 70; }
        else if(m.type === 'guardian') { goldAward = 220; xpAward = 45; }
        else if(m.type === 'witch_boss') { goldAward = 300; xpAward = 60; }
        else if(m.type === 'gold_knight') { goldAward = 160; xpAward = 35; }
    }
    
    Game.gold += goldAward; 
    Game.xp += xpAward; 
    Game.mobs.splice(index, 1); 
    updateUI();
}

function draw() {
    ctx.fillStyle = Game.world === 'KASABA' ? "#1a2e18" : "#080808";
    ctx.fillRect(0,0,canvas.width, canvas.height);

    ctx.save();
    ctx.translate(-Game.cam.x + (Math.random()-0.5)*Game.shake, -Game.cam.y + (Math.random()-0.5)*Game.shake);
    if(Game.shake > 0) Game.shake *= 0.9;

    if(Game.world === 'KASABA') {
        drawBuilding(-400, 200, "#cd7f32", "BAKKAL MAHMUT");
        drawBuilding(400, 200, "#00ced1", "KALIPÇI HASAN");
        drawBuilding(0, -250, "#ff4500", "DEMİRCİ");
        drawBuilding(500, -400, "#9932cc", "BÜYÜCÜ MUHİTTİN");
        ctx.fillStyle = "#000"; ctx.fillRect(-150, 1000, 300, 100);
    }

    // Sandıkları Çiz
    Game.chests.forEach(c => {
        if(!c.opened) {
            ctx.fillStyle = "#ffaa00"; ctx.fillRect(c.x-20, c.y-15, 40, 30);
            ctx.fillStyle = "#664400"; ctx.fillRect(c.x-20, c.y-5, 40, 5);
            ctx.fillStyle = "#fff"; ctx.font = "10px Arial"; ctx.fillText("📦 SANDIK", c.x-23, c.y-22);
        }
    });

    // Boss Taşlarını Çiz
    Game.bossAltars.forEach(a => {
        ctx.fillStyle = "#555555"; ctx.fillRect(a.x-30, a.y-40, 60, 60);
        ctx.fillStyle = "#00ffff";
        ctx.font = "bold 10px Arial"; ctx.textAlign = "center";
        ctx.fillText(`🪨 BOSS TAŞI (${a.insertedKeys}/2)`, a.x, a.y-50);
    });

    Game.blocks.forEach(b => {
        ctx.fillStyle = MATS[b.type].c;
        ctx.fillRect(b.x-25, b.y-25, 50, 50);
        if(b.ess) { ctx.strokeStyle = b.ess === 'fire' ? '#ff3300' : '#00ffff'; ctx.lineWidth = 3; ctx.strokeRect(b.x-27, b.y-27, 54, 54); }
    });

    Game.mobs.forEach(m => {
        ctx.fillStyle = m.frozen > 0 ? "#a5f2f3" : m.c;
        ctx.fillRect(m.x - m.size/2, m.y - m.size/2, m.size, m.size);
        
        // Can Barı Bosslar İçin Üstte Çıkar
        if(m.isBoss) {
            ctx.fillStyle = "rgba(0,0,0,0.6)"; ctx.fillRect(m.x - 40, m.y - m.size/2 - 20, 80, 8);
            ctx.fillStyle = "#ff0000"; ctx.fillRect(m.x - 40, m.y - m.size/2 - 20, (m.hp / m.maxHp) * 80, 8);
        }

        if(m.type === 'guardian' && m.frozen <= 0) {
            ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2;
            ctx.strokeRect(m.x - m.size/2 - 2, m.y - m.size/2 - 2, m.size + 4, m.size + 4);
        }
    });

    // Projeler
    Game.projectiles.forEach(p => {
        ctx.fillStyle = "#ffff00"; ctx.fillRect(p.x-4, p.y-4, 8, 8);
    });
    Game.enemyProjectiles.forEach(p => {
        ctx.fillStyle = p.isWave ? "#00bfff" : "#ffffff";
        if(p.isWave) {
            ctx.beginPath(); ctx.arc(p.x, p.y, 25, 0, Math.PI*2); ctx.stroke();
        } else {
            ctx.beginPath(); ctx.arc(p.x, p.y, 5, 0, Math.PI*2); ctx.fill();
        }
    });

    Game.parts.forEach(p => { ctx.globalAlpha = p.l/45; ctx.fillStyle = p.c; ctx.fillRect(p.x, p.y, 4, 4); });
    ctx.globalAlpha = 1;

    // Oyuncuyu Çiz
    ctx.save();
    ctx.translate(Game.p.x, Game.p.y);
    let bob = Math.sin(Game.p.anim) * 4;
    ctx.fillStyle = "#f3d2b3"; ctx.fillRect(-20, -40 + bob, 40, 40);
    
    let activeChest = Game.items.find(i => i.id === Game.equipped.chest);
    if(activeChest) { ctx.fillStyle = MATS[activeChest.matIdx].c; ctx.fillRect(-22, -25 + bob, 44, 25); }
    let activeHead = Game.items.find(i => i.id === Game.equipped.head);
    if(activeHead) { ctx.fillStyle = MATS[activeHead.matIdx].c; ctx.fillRect(-22, -45 + bob, 44, 12); }
    
    ctx.font = "20px Arial";
    let itemIcon = "🗡️";
    if(Game.slot === 2) itemIcon = "⛏️";
    if(Game.slot === 3) itemIcon = "💊";
    if(Game.slot === 4) itemIcon = "🏹";
    ctx.fillText(itemIcon, 20, -10 + bob);
    ctx.restore();

    ctx.restore();
    requestAnimationFrame(draw);
}

function drawBuilding(x, y, c, t) {
    ctx.fillStyle = "#333"; ctx.fillRect(x-80, y-80, 160, 160);
    ctx.fillStyle = c; ctx.fillRect(x-30, y-10, 60, 70);
    ctx.fillStyle = "#fff"; ctx.font = "bold 14px Arial"; ctx.textAlign = "center"; ctx.fillText(t, x, y-90);
}

function updateUI() {
    document.getElementById("hp-fill").style.width = Game.hp + "%";
    document.getElementById("xp-fill").style.width = Game.xp + "%";
    document.getElementById("gold-txt").innerText = Math.floor(Game.gold);
    document.getElementById("lvl-txt").innerText = Game.playerLvl;

    if(Game.enchant.type !== 'Normal') {
        document.getElementById("ult-container").style.display = "block";
        document.getElementById("ult-fill").style.width = Game.ult + "%";
        document.getElementById("ult-label").innerText = `${Game.enchant.type.toUpperCase()} HAREKETİ (%${Game.ult}) - [Q]`;
    }

    const invGrid = document.getElementById("main-inv");
    invGrid.innerHTML = "";
    
    Game.items.forEach(item => {
        if(item.count <= 0) return;
        let slot = document.createElement("div");
        slot.className = "slot";
        if(item.id === Game.equipped.weapon || item.id === Game.equipped.pick || item.id === Game.equipped.head || item.id === Game.equipped.chest) {
            slot.classList.add("equipped");
        }
        
        let icon = "📦";
        if(item.type === 'weapon') icon = "🗡️";
        else if(item.type === 'pick') icon = "⛏️";
        else if(item.type === 'head') icon = "🪖";
        else if(item.type === 'chest') icon = "👕";
        else if(item.name === 'meds') icon = "💊";
        else if(item.name.includes('ess')) icon = "✨";
        else if(item.name.includes('mold')) icon = "📜";
        else if(item.type === 'key') icon = "🔑";

        slot.innerHTML = icon + `<div class="slot-name">${item.display}</div>`;
        slot.setAttribute("data-count", item.count);
        slot.onclick = () => inspectItem(item);
        invGrid.appendChild(slot);
    });
}

function inspectItem(item) {
    const panel = document.getElementById("inspect-panel");
    if(!item) { panel.innerHTML = "Bir eşya seçin..."; return; }
    Game.selectedItem = item;

    let details = `<h3>${item.display}</h3><p>Tür: ${item.type.toUpperCase()}</p>`;
    if(item.power) details += `<p>Etki/Güç: +${item.power}</p>`;
    
    if(['weapon','pick','head','chest'].includes(item.type)) {
        let isEquipped = Game.equipped[item.type] === item.id;
        details += `<button onclick="toggleEquip('${item.id}', '${item.type}')" style="background:${isEquipped?'#444':'#006600'}; color:white; border:none; padding:8px; width:100%; border-radius:5px; cursor:pointer; font-weight:bold; margin-bottom:5px;">
            ${isEquipped ? '❌ EŞYAYI ÇIKAR' : '✅ KUŞAN / TAK'}
        </button>`;
    }

    if(item.name === 'bakir' && item.count >= 8) {
        details += `<hr/><button onclick="craftDirectArmor('head', 0, 8, 'Bakır Miğfer')" class="npc-btn">🔨 Bakır Miğfer Üret (8 Bakır)</button>`;
        if(item.count >= 15) {
            details += `<button onclick="craftDirectArmor('chest', 0, 15, 'Bakır Göğüslük')" class="npc-btn">🔨 Bakır Göğüslük Üret (15 Bakır)</button>`;
        }
    }

    let singleValue = 0;
    if(item.type === 'resource') {
        let fIdx = MATS.findIndex(m => m.key === item.name);
        if(fIdx !== -1) singleValue = MATS[fIdx].v;
        if(item.name.includes('ess')) singleValue = 400;
    } else if(item.type === 'mold') {
        singleValue = 500;
    }

    if(singleValue > 0) {
        details += `<hr/><button onclick="sellSingleItem('${item.name}')" style="background:#cc9900; color:#000; font-weight:bold;" class="npc-btn">💰 1 Adet Sat (+${singleValue} Altın)</button>`;
    }

    panel.innerHTML = details;
}

function sellSingleItem(name) {
    let item = getInvItem(name);
    if(item && item.count > 0) {
        let value = 0;
        let fIdx = MATS.findIndex(m => m.key === name);
        if(fIdx !== -1) value = MATS[fIdx].v;
        else if(name.includes('ess')) value = 400;
        else if(item.type === 'mold') value = 500;

        Game.gold += value; item.count--; updateUI();
        if(item.count <= 0) inspectItem(null); else inspectItem(item);
    }
}

function toggleEquip(id, type) {
    if(Game.equipped[type] === id) { Game.equipped[type] = null; } 
    else { Game.equipped[type] = id; }
    updateUI(); inspectItem(Game.items.find(i=>i.id===id));
}

function craftDirectArmor(type, matIdx, req, displayName) {
    let copper = getInvItem('bakir');
    if(copper && copper.count >= req) {
        copper.count -= req;
        addInvItem({ type: type, name: 'armor_' + type + '_' + matIdx, display: displayName, matIdx: matIdx, power: req * 3, count: 1 });
        updateUI(); inspectItem(copper); alert(displayName + " Başarıyla Üretildi!");
    }
}

function checkNPC() {
    const a = document.getElementById("npc-actions"), n = document.getElementById("npc-name"), ui = document.getElementById("npc-ui");
    a.innerHTML = "";

    if(dist(Game.p, {x:-400, y:200}) < 150) {
        ui.style.display = "block"; n.innerText = "BAKKAL MAHMUT";
        a.innerHTML = `<button class="npc-btn" onclick="sellAllResources()">💰 Tüm Kaynakları Toplu Sat</button>`;
    } else if(dist(Game.p, {x:400, y:200}) < 150) {
        ui.style.display = "block"; n.innerText = "KALIPÇI HASAN";
        MATS.forEach((m, idx) => {
            if(idx > 0) { a.innerHTML += `<button class="npc-btn" onclick="buyMoldItem('${m.key}', ${idx * 1500})">📜 ${m.n} Kalıbı Al (${idx * 1500} Altın)</button>`; }
        });
    } else if(dist(Game.p, {x:0, y:-250}) < 150) {
        ui.style.display = "block"; n.innerText = "DEMİRCİ ÜRETİM";
        a.innerHTML = `<p style="font-size:10px;color:#aaa;">Silah için 10 Maden+Kalıp, Zırh için 15 Maden gerekir.</p>`;
        MATS.forEach((m, idx) => {
            a.innerHTML += `<button class="npc-btn" onclick="craftNewWeapon('${m.key}', ${idx})">⚔️ / ⛏️ ${m.n} Alet Seti Üret</button>`;
            if(idx > 0) {
                a.innerHTML += `<button class="npc-btn" style="background:#223344;" onclick="craftNpcArmor('head', '${m.key}', ${idx}, '${m.n} Miğfer')">🪖 ${m.n} Miğfer Yap (15 ${m.n})</button>`;
                a.innerHTML += `<button class="npc-btn" style="background:#223344;" onclick="craftNpcArmor('chest', '${m.key}', ${idx}, '${m.n} Göğüslük')">👕 ${m.n} Göğüslük Yap (15 ${m.n})</button>`;
            }
        });
    } else if(dist(Game.p, {x:500, y:-400}) < 150) {
        ui.style.display = "block"; n.innerText = "BÜYÜCÜ MUHİTTİN";
        a.innerHTML = `
            <div style="font-size:11px; margin-bottom:5px; color:#ffcc00;">Mevcut LVL: ${Game.playerLvl}</div>
            <button class="npc-btn" onclick="buyLevelUp()">🔮 Muhittin İle Seviye Atla (400 Altın + 20 XP)</button>
            <hr/>
            <button class="npc-btn" onclick="applyMuhittinEnchant('Ateş', 'fire_ess')">🔥 Ateş Büyüsü (1000g + 30 XP + 1 Ateş Esansı)</button>
            <button class="npc-btn" onclick="applyMuhittinEnchant('Buz', 'ice_ess')">❄️ Buz Büyüsü (1000g + 30 XP + 1 Buz Esansı)</button>
        `;
    } else { ui.style.display = "none"; }
}

function sellAllResources() {
    let income = 0;
    MATS.forEach(m => {
        let item = getInvItem(m.key); if(item) { income += item.count * m.v; item.count = 0; }
    });
    Game.gold += income; updateUI(); toggleInv();
}

function buyMoldItem(matKey, cost) {
    if(Game.gold >= cost) {
        Game.gold -= cost;
        addInvItem({ type: 'mold', name: matKey + '_mold', display: matKey.toUpperCase() + ' Kalıbı', count: 1 });
        updateUI(); checkNPC(); alert("Kalıbınız başarıyla üretildi!");
    } else alert("Yetersiz Altın!");
}

function craftNewWeapon(matKey, matIdx) {
    let matItem = getInvItem(matKey);
    let moldItem = getInvItem(matKey + '_mold');
    let hasMold = (matIdx === 1) ? true : (moldItem && moldItem.count > 0);

    if(matItem && matItem.count >= 10 && hasMold) {
        matItem.count -= 10; let pwr = MATS[matIdx].p;
        addInvItem({ type: 'weapon', name: matKey + '_sword', display: MATS[matIdx].n + ' Kılıç', matIdx: matIdx, power: pwr * 12, count: 1 });
        addInvItem({ type: 'pick', name: matKey + '_pick', display: MATS[matIdx].n + ' Kazma', matIdx: matIdx, power: pwr, count: 1 });
        updateUI(); toggleInv(); alert(`Yeni ${MATS[matIdx].n} Ekipmanlarınız Hazır!`);
    } else alert("Yetersiz kaynak veya kalıp yok!");
}

function craftNpcArmor(type, matKey, matIdx, displayName) {
    let matItem = getInvItem(matKey);
    if(matItem && matItem.count >= 15) {
        matItem.count -= 15;
        addInvItem({ type: type, name: 'armor_' + type + '_' + matIdx, display: displayName, matIdx: matIdx, power: (matIdx + 1) * 20, count: 1 });
        updateUI(); toggleInv(); alert(`${displayName} Başarıyla Demirci Tarafından Üretildi!`);
    } else alert("Yetersiz maden! 15 adet gerekiyor.");
}

function buyLevelUp() {
    if(Game.gold >= 400 && Game.xp >= 20) { Game.gold -= 400; Game.xp -= 20; Game.playerLvl++; updateUI(); checkNPC(); }
    else alert("Yetersiz Altın veya XP!");
}

function applyMuhittinEnchant(type, essKey) {
    let essItem = getInvItem(essKey);
    if(Game.gold >= 1000 && Game.xp >= 30 && essItem && essItem.count >= 1) {
        Game.gold -= 1000; Game.xp -= 30; essItem.count--;
        Game.enchant = { type: type, p: 1.6 }; Game.ult = 0; updateUI(); checkNPC(); alert(`${type} Büyüsü Başarıyla Silahınıza İşlendi!`);
    } else alert("Yetersiz Altın, XP veya Esans!");
}

function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

updateUI();
requestAnimationFrame(draw);
setInterval(update, 1000/60);
</script>
